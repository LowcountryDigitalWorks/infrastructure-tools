name: Auto Browser synthetic proof

on:
  pull_request:
    paths:
      - 'auto-browser/**'
      - '.github/workflows/auto-browser-validation.yml'

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only browser dependency
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Synthetic no-external-site interaction tests
        run: python -m unittest discover -s auto-browser -p 'test_*.py' -v
