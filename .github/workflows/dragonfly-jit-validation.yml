name: Dragonfly JIT source validation

on:
  pull_request:
    paths:
      - 'dragonfly-jit/**'
      - 'tools/dragonfly_canary_publication.py'
      - 'tools/dragonfly_canary_redrix_install.py'
      - 'tests/dragonfly-canary-publication/**'
      - 'ci-dispatch/DragonflyCanary.psm1'
      - 'ci-dispatch/DragonflyCanaryRuntime.psm1'
      - 'ci-dispatch/Invoke-DragonflyCanaryProduction.ps1'
      - 'ci-dispatch/Invoke-DragonflyGateA1.ps1'
      - 'ci-dispatch/DragonflyCanaryAdjunctPublisher.psm1'
      - 'ci-dispatch/tests/Test-DragonflyCanary.ps1'
      - 'ci-dispatch/tests/Test-DragonflyCanaryRuntime.ps1'
      - '.github/workflows/dragonfly-jit-validation.yml'
      - '.github/workflows/dragonfly-jit-canary.yml'
  push:
    branches:
      - 'feat/ci-runner-dragonfly-jit-001'
      - 'feat/dragonfly-jit-canary-001'
      - 'feat/dragonfly-jit-canary-publish-001'
    paths:
      - 'dragonfly-jit/**'
      - 'tools/dragonfly_canary_publication.py'
      - 'tools/dragonfly_canary_redrix_install.py'
      - 'tests/dragonfly-canary-publication/**'
      - 'ci-dispatch/DragonflyCanary.psm1'
      - 'ci-dispatch/DragonflyCanaryRuntime.psm1'
      - 'ci-dispatch/Invoke-DragonflyCanaryProduction.ps1'
      - 'ci-dispatch/Invoke-DragonflyGateA1.ps1'
      - 'ci-dispatch/DragonflyCanaryAdjunctPublisher.psm1'
      - 'ci-dispatch/tests/Test-DragonflyCanary.ps1'
      - 'ci-dispatch/tests/Test-DragonflyCanaryRuntime.ps1'
      - '.github/workflows/dragonfly-jit-validation.yml'
      - '.github/workflows/dragonfly-jit-canary.yml'

permissions:
  contents: read

jobs:
  redrix-package-modes:
    name: REDRIX and LDW01 package modes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native and cross-platform REDRIX and LDW01 archive modes
        run: python -m unittest discover -s tests/dragonfly-canary-publication -p 'test_*_package_modes.py' -v
      - name: Verify byte-exact adjunct blob materialization
        shell: pwsh
        run: ./tests/dragonfly-canary-publication/Test-DragonflyAdjunctMaterialization.ps1
      - name: Verify Gate A1 operator under Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./tests/dragonfly-canary-publication/Test-DragonflyGateA1Operator.ps1

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile Dragonfly source contracts
        run: |
          python3 -m py_compile \
            dragonfly-jit/dragonfly_jit.py \
            dragonfly-jit/owner_controls.py \
            dragonfly-jit/install_owner_controls.py \
            dragonfly-jit/bridge_adapter.py \
            dragonfly-jit/handoff_contract.py \
            dragonfly-jit/ssh_transport_contract.py \
            dragonfly-jit/ssh_forced_receiver.py \
            dragonfly-jit/canary_executor.py \
            tools/dragonfly_canary_publication.py \
            tools/dragonfly_canary_redrix_install.py
      - name: Parse bounded LDW01 publication source
        shell: pwsh
        run: |
          foreach ($path in @(
            './ci-dispatch/Invoke-DragonflyCanaryProduction.ps1',
            './ci-dispatch/Invoke-DragonflyGateA1.ps1',
            './ci-dispatch/DragonflyCanaryAdjunctPublisher.psm1'
          )) {
            $tokens = $null
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count) { throw 'DRAGONFLY_PUBLICATION_POWERSHELL_PARSE_FAILED' }
          }
          'DRAGONFLY_PUBLICATION_POWERSHELL_PARSE=PASS'
      - name: Validate bounded Gate A1 operator contract
        shell: pwsh
        run: ./tests/dragonfly-canary-publication/Test-DragonflyGateA1Operator.ps1
      - name: Run lifecycle, transport, and canary contract tests
        run: python3 -m unittest discover -s dragonfly-jit/tests -p 'test_*.py' -v
      - name: Run publication and install contract tests
        run: python3 -m unittest discover -s tests/dragonfly-canary-publication -p 'test_*.py' -v
      - name: Validate protected LDW01 adjunct publisher contract
        shell: pwsh
        run: ./tests/dragonfly-canary-publication/Test-DragonflyCanaryAdjunctPublisher.ps1
      - name: Validate Dragonfly canary guest bootstrap
        shell: bash
        run: bash -n dragonfly-jit/canary-guest/bootstrap.sh
      - name: Validate LDW01 Dragonfly canary registration contract
        shell: pwsh
        run: ./ci-dispatch/tests/Test-DragonflyCanary.ps1
      - name: Validate LDW01 Dragonfly canary transport and provider contract
        shell: pwsh
        run: ./ci-dispatch/tests/Test-DragonflyCanaryRuntime.ps1
      - name: Refuse provider authority in REDRIX runtime source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='*.md' --exclude-dir='tests' \
            '(gh api|GITHUB_TOKEN|ACTIONS_RUNTIME_TOKEN|registration-token|generate-jitconfig)' \
            dragonfly-jit; then
            echo 'REDRIX runtime source must not acquire GitHub provider authority.' >&2
            exit 1
          fi
          if grep -RIn --exclude='*.md' --exclude-dir='tests' -- 'jitconfig' dragonfly-jit; then
            echo 'REDRIX host runtime source must not directly consume runner configuration material.' >&2
            exit 1
          fi
          echo 'REDRIX_PROVIDER_AUTHORITY_BOUNDARY=PASS'
      - name: Audit secretless canary workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/dragonfly-jit-canary.yml').read_text(encoding='utf-8')
          run_label = 'dragonfly-run-$' + '{{ github.run_id }}'
          attempt_label = 'dragonfly-attempt-$' + '{{ github.run_attempt }}'
          for value in (
              'secrets.',
              'schedule:',
              'pull_request:',
              'push:',
              'permissions:\n  contents:',
              'actions/checkout',
          ):
              if value in text:
                  raise SystemExit(f'CANARY_WORKFLOW_FORBIDDEN:{value}')
          for value in (
              'workflow_dispatch:',
              'permissions: {}',
              'dragonfly-canary:',
              run_label,
              attempt_label,
              'synthetic-only',
              'DRAGONFLY_SECRETLESS_CANARY=PASS',
          ):
              if value not in text:
                  raise SystemExit(f'CANARY_WORKFLOW_REQUIRED_MISSING:{value}')
          print('DRAGONFLY_CANARY_WORKFLOW_BOUNDARY=PASS')
          PY
