name: Slice 3 bounded publisher-fixture correction

on:
  push:
    branches: [host-agent/ci-jit-local-status-slice3-20261026]
    paths: ['.github/workflows/slice3-testfix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Make test fixture mirror production git-archive publication
        shell: bash
        env:
          EXPECTED_PARENT: fd5906be27acfc9feb8b6e4be01d3c0c17d20c34
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path
          p=Path('ci-dispatch/tests/Test-Dispatch.ps1')
          s=p.read_text(encoding='utf-8')
          old="""    foreach($path in @(Get-Ci10RuntimeFiles)){\n        $target=Join-Path $bundle $path\n        $null=New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force\n        Copy-Item -LiteralPath (Join-Path $repo $path) -Destination $target\n    }\n"""
          new="""    $runtimeArchive=Join-Path $fixture 'manifest-runtime.zip'\n    & git -C $repo archive --format=zip ('--output='+$runtimeArchive) HEAD -- @(Get-Ci10RuntimeFiles) 2>$null\n    if($LASTEXITCODE -ne 0){throw 'TEST_RUNTIME_ARCHIVE_FAILED'}\n    [IO.Compression.ZipFile]::ExtractToDirectory($runtimeArchive,$bundle)\n    Remove-Item -LiteralPath $runtimeArchive -Force\n"""
          if s.count(old)!=1:
              raise SystemExit('expected exactly one working-tree bundle fixture')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          git diff --check
          git config user.name 'LDW bounded source finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-dispatch/tests/Test-Dispatch.ps1
          git commit -m 'HOST-AGENT-CI-JIT-STATUS-001: mirror publisher archive in verifier fixture'
          git push origin HEAD:host-agent/ci-jit-local-status-slice3-20261026
