name: Commander session synthetic proof

on:
  pull_request:
    paths:
      - 'commander/prototype/**'
      - '.github/workflows/commander-session-validation.yml'

permissions:
  contents: read

jobs:
  synthetic-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned signature-verification dependency
        run: python -m pip install -r commander/prototype/requirements.txt
      - name: Run no-OS-mutation session tests
        run: python -m unittest discover -s commander/prototype -p 'test_*.py' -v
