name: CI control-plane deterministic validation

on:
  push:
    paths:
      - 'ci-dispatch/**'
      - 'ci-runner/**'
      - 'host-agent/**'
      - '.github/workflows/ci-control-plane-validation.yml'
  pull_request:
    paths:
      - 'ci-dispatch/**'
      - 'ci-runner/**'
      - 'host-agent/**'
      - '.github/workflows/ci-control-plane-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse CI and deployment PowerShell
        shell: pwsh
        run: |
          $allErrors=@()
          Get-ChildItem ci-dispatch,ci-runner,host-agent/deploy -Recurse -File | Where-Object { $_.Extension -in @('.ps1','.psm1') } | ForEach-Object {
            $tokens=$null
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if($allErrors.Count){
            $allErrors | Format-List | Out-String | Write-Error
            throw "PowerShell parser reported $($allErrors.Count) error(s)."
          }

      - name: Run dispatcher contract tests
        shell: pwsh
        run: pwsh ./ci-dispatch/tests/Test-Dispatch.ps1

      - name: Diagnose historical controller snapshot hashes
        shell: pwsh
        run: |
          $commit='68a535fd3df17bae59fdb86386fac85e024b1650'
          $paths=@(
            'ci-runner/CiRunner.psm1',
            'ci-runner/Invoke-IsolatedRunner.ps1',
            'ci-runner/Native.cs',
            'ci-runner/guest/bootstrap.sh',
            'ci-runner/guest/ci7-runner.service',
            'ci-runner/guest/run-one.sh'
          )
          $root=Join-Path $env:RUNNER_TEMP ('controller-snapshot-'+[guid]::NewGuid().ToString('N'))
          $zip=$root+'.zip'
          New-Item -ItemType Directory -Path $root | Out-Null
          git archive --format=zip ("--output=$zip") $commit -- @paths
          if($LASTEXITCODE -ne 0){throw 'CONTROLLER_SNAPSHOT_DIAGNOSTIC_ARCHIVE_FAILED'}
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          foreach($path in $paths){
            $sha=(Get-FileHash -LiteralPath (Join-Path $root $path) -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host ("CONTROLLER_SNAPSHOT_SHA256 path=$path sha256=$sha")
          }

      - name: Run protected controller snapshot tests
        shell: pwsh
        run: pwsh ./ci-dispatch/tests/Test-ControllerSnapshots.ps1

      - name: Run sanitized status projection tests
        shell: pwsh
        run: pwsh ./ci-dispatch/tests/Test-StatusProjection.ps1

      - name: Diff whitespace validation
        shell: pwsh
        run: |
          $base=(git merge-base origin/main HEAD).Trim()
          git diff --check "$base...HEAD"
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed.'}
