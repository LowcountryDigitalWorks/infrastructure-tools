name: Host Agent persistent helper validation

on:
  push:
    branches: [main, feat/host-agent-persistent-helper-deploy-v2]
    paths:
      - 'host-agent/**'
      - '.github/workflows/host-agent-persistent-helper-validation.yml'
  pull_request:
    paths:
      - 'host-agent/**'
      - '.github/workflows/host-agent-persistent-helper-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Parse deployment PowerShell
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem host-agent/deploy -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count -ne 0) {
            $allErrors | Format-List | Out-String | Write-Error
            throw "PowerShell parser reported $($allErrors.Count) error(s)."
          }

      - name: Run deployment contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-DeploymentContracts.ps1

      - name: Run Host Agent Windows package/deployment contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-HostAgentWindowsDeploymentContracts.ps1

      - name: Run Host Agent Windows behavioral deployment tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-HostAgentWindowsDeploymentBehavioral.ps1

      - name: Exercise Host Agent Windows immutable-tree package and read-only Plan
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'ldw-host-agent-windows-package'
          pwsh ./host-agent/deploy/Publish-HostAgentWindowsPackage.ps1 -OutputDirectory $out
          $commit = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $manifestPath = Join-Path $out 'manifest.json'
          $exePath = Join-Path $out 'LDW.HostAgent.Windows.exe'
          $manifestSha = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSha = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeBytes = (Get-Item -LiteralPath $exePath).Length
          pwsh ./host-agent/deploy/Manage-HostAgentWindowsDeployment.ps1 `
            -Action Plan `
            -PackageDirectory $out `
            -ExpectedSourceCommit $commit `
            -ExpectedSourceTree $tree `
            -ExpectedManifestSha256 $manifestSha `
            -ExpectedExecutableSha256 $exeSha `
            -ExpectedExecutableBytes $exeBytes

      - name: Run CI/JIT DISCOVER classification contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitDiscoverClassificationContracts.ps1

      - name: Verify CI/JIT task readback and throwaway Task Scheduler semantics
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitTaskReadbackContracts.ps1 -HostedTaskSchedulerSemantic

      - name: Run CI/JIT local task client contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitLocalTaskClientContracts.ps1

      - name: Run CI/JIT broker client contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitControlClientContracts.ps1

      - name: Run CI/JIT ABORT_ACTIVE semantic contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitAbortActiveContracts.ps1

      - name: Run CI/JIT Phase-2 observe proof contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-CiJitPhase2ObserveProofContracts.ps1

      - name: Run Admin Broker package contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-AdminBrokerPackageContracts.ps1

      - name: Run tray autostart contract tests
        shell: pwsh
        run: pwsh ./host-agent/deploy/tests/Test-TrayAutostartContracts.ps1

      - name: Restore Host Agent
        shell: pwsh
        run: dotnet restore ./host-agent/LDW.HostAgent.sln

      - name: Build Host Agent Release
        shell: pwsh
        run: dotnet build ./host-agent/LDW.HostAgent.sln -c Release --no-restore

      - name: Render Host Agent UX evidence smoke
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'host-agent-ux-evidence'
          dotnet run --project ./host-agent/tools/LDW.HostAgent.UxEvidence/LDW.HostAgent.UxEvidence.csproj -c Release -- $out
          foreach ($name in @('healthy.png','attention-unknown.png','failed.png','tray-icon-sizes.png')) {
            $path = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "UX evidence missing: $name" }
            if ((Get-Item -LiteralPath $path).Length -lt 1024) { throw "UX evidence unexpectedly small: $name" }
          }

      - name: Run Host Agent core contract tests
        shell: pwsh
        run: dotnet run --project ./host-agent/tests/LDW.HostAgent.Core.Tests/LDW.HostAgent.Core.Tests.csproj -c Release --no-build

      - name: Run Hyper-V observer tests
        shell: pwsh
        run: dotnet run --project ./host-agent/tests/LDW.HostAgent.HyperVObserver.Tests/LDW.HostAgent.HyperVObserver.Tests.csproj -c Release --no-build

      - name: Run Admin Broker contract tests
        shell: pwsh
        run: dotnet run --project ./host-agent/tests/LDW.AdminBroker.Tests/LDW.AdminBroker.Tests.csproj -c Release --no-build

      - name: Prove bounded publish and non-mutating plan
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:RUNNER_TEMP 'host-agent-hyperv-observer-publish'
          pwsh ./host-agent/deploy/Publish-HyperVObserver.ps1 -OutputDirectory $publishRoot
          pwsh ./host-agent/deploy/Plan-HyperVObserverDeployment.ps1 `
            -PublishedDirectory $publishRoot `
            -PermittedCallerSid 'S-1-5-21-1000000000-1000000001-1000000002-1001'

      - name: Build and smoke-test Admin Broker proof package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'ldw-admin-broker-proof'
          pwsh ./host-agent/deploy/Publish-AdminBrokerProofPackage.ps1 -OutputDirectory $packageRoot

      - name: Retain accepted-main Admin Broker proof package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ldw-admin-broker-proof-${{ github.sha }}
          path: ${{ runner.temp }}/ldw-admin-broker-proof/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Diff whitespace validation
        shell: pwsh
        run: |
          $base = (git merge-base origin/main HEAD).Trim()
          git diff --check "$base...HEAD"
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
