name: Chat Relay local proof

on:
  pull_request:
    paths:
      - 'chat-relay/**'
      - '.github/workflows/chat-relay-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python standard-library test suite
        run: python3 -m unittest discover -s chat-relay -p 'test_*.py' -v
