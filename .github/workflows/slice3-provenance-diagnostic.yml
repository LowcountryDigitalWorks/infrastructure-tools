name: Slice 3 bounded verifier diagnostic

on:
  push:
    branches: [host-agent/ci-jit-local-status-slice3-20261026]
    paths: ['.github/workflows/slice3-provenance-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact verifier inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Import-Module ./ci-dispatch/Dispatch.psm1 -Force
          $root=Join-Path $env:RUNNER_TEMP ('diag-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root|Out-Null
          $archive=Join-Path $root 'runtime.zip'
          & git archive --format=zip ('--output='+$archive) HEAD -- @(Get-Ci10RuntimeFiles)
          if($LASTEXITCODE -ne 0){throw 'ARCHIVE_FAILED'}
          $bundle=Join-Path $root 'bundle';New-Item -ItemType Directory -Path $bundle|Out-Null
          [IO.Compression.ZipFile]::ExtractToDirectory($archive,$bundle)
          $recordPath=Join-Path $bundle 'ci-dispatch/verifier-provenance.json'
          $accepted=Get-Content $recordPath -Raw|ConvertFrom-Json
          $dispatch=Join-Path $bundle 'ci-dispatch/Dispatch.psm1'
          'HEAD='+(& git rev-parse HEAD)
          'DISPATCH_BLOB='+(& git rev-parse HEAD:ci-dispatch/Dispatch.psm1)
          'VERIFIER_RECORD_BLOB='+(& git rev-parse HEAD:ci-dispatch/verifier-provenance.json)
          'ARCHIVE_DISPATCH_SHA='+((Get-FileHash $dispatch -Algorithm SHA256).Hash.ToLowerInvariant())
          'ARCHIVE_VERIFIER_RECORD_SHA='+((Get-FileHash $recordPath -Algorithm SHA256).Hash.ToLowerInvariant())
          'RECORD_COMMIT='+$accepted.commit
          'RECORD_TREE='+$accepted.tree
          'RECORD_BLOB='+$accepted.blob
          'RECORD_SHA='+$accepted.sha256
