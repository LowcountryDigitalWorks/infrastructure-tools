name: Slice 3 bounded Windows archive pin refresh

on:
  push:
    branches: [host-agent/ci-jit-local-status-slice3-20261026]
    paths: ['.github/workflows/slice3-provenance-diagnostic.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh exact publisher and deterministic-test pins
        shell: pwsh
        env:
          EXPECTED_PARENT: bf2313a089b06284e87dca7172410a84a03ac3b8
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD^) -ne $env:EXPECTED_PARENT) { throw 'PIN_REFRESH_PARENT_MOVED' }
          $replacements = [ordered]@{
            '75895bc9b0500c99787bb938115a6b969c96f15bba156c1bf85878e1df794b8e' = 'fdcf67a7bbfeacd5d293876bbfa7622e41de98e09ddbeecbed6bcb7d2abea6d9'
            '467ab8f2d1821f0468fe2840708cd8172d994ba0' = '0537fcd212e8e9174f3b7388fcb992f9fccda8b6'
            '8a3c3a74aedd03eb1e88c79085cadf4bcd530a4adf8a179caf42811216478079' = 'c821f3184cf17694036a59f7c13377c3ac82d618166c2c576f67e4e85c455ba5'
          }
          $paths = @('ci-dispatch/Publish-Bundle.ps1') + @(Get-ChildItem ci-dispatch/tests -File -Filter '*.ps1' | ForEach-Object FullName)
          foreach ($path in $paths) {
            $text = Get-Content -LiteralPath $path -Raw
            foreach ($pair in $replacements.GetEnumerator()) { $text = $text.Replace($pair.Key,$pair.Value) }
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'PIN_REFRESH_DIFF_FAILED' }
          git config user.name 'LDW bounded source finalizer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-dispatch/Publish-Bundle.ps1 ci-dispatch/tests
          if (-not (git diff --cached --name-only)) { throw 'PIN_REFRESH_EMPTY' }
          git commit -m 'HOST-AGENT-CI-JIT-STATUS-001: bind publisher pins to Windows archive bytes'
          git push origin HEAD:host-agent/ci-jit-local-status-slice3-20261026
