plugins {
    id "com.android.application"
}

android {
    namespace "com.lowcountrydigitalworks.commander.diagnostic"
    compileSdk 36

    defaultConfig {
        applicationId "com.lowcountrydigitalworks.commander.diagnostic"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0-diagnostic"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
